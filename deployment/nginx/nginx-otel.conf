# /etc/nginx/nginx.conf

# Required if ngx_otel_module.so is a dynamically loaded module.
load_module modules/ngx_otel_module.so;

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_time=$request_time '
        'traceparent="$http_traceparent"';

    access_log /var/log/nginx/access.log main;

    # Basic HTTP settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------------------------------------------------------
    # OpenTelemetry
    # ---------------------------------------------------------

    # Replace with the actual reachable Swarm service DNS name
    # if it differs in your deployment.
    otel_exporter {
        endpoint rogue-otel_otel:4317;
        interval 5s;
    }

    # Identifies this service in traces.
    otel_service_name angular-frontend;

    # Sample 10% of requests. Set to 1.0 for all requests.
    otel_trace on;
    otel_trace_context propagate;

    # ---------------------------------------------------------
    # Angular single-page application
    # ---------------------------------------------------------

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check for container/orchestrator monitoring.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # OpenTelemetry tracing for application requests.
        # Avoid tracing health checks to reduce noise.
        location = /health/ready {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Angular client-side routing.
        location / {
            otel_trace_context propagate;
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets with fingerprinted filenames.
        location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Do not cache the Angular entry point; it references
        # the current release's asset filenames.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Prevent access to hidden files, except ACME challenges
        # if you intentionally serve them from this container.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}