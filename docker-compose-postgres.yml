version: "3.9"
services:
  ###############################################################################
  # Postgres database
  ###############################################################################
  postgres-db:
    image: postgres:18
    volumes:
      - ${ROGUE_DATA}/postgres:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      # POSTGRES_POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_MAX_CONNECTIONS: 100
      TZ: Africa/Gaborone
    # depends_on:
    #   proxy:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "/opt/bitnami/postgresql/bin/pg_isready", "--username=postgres"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
    command:
      - postgres
      - -c
      - max_connections=300
    networks:
      rogue-public:
    deploy:
      placement:
        constraints:
          # Make the traefik service run only on the node with this label
          # as the node with it has the volume for the certificates
          - node.labels.rogue_db == true
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.rogue-db.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.rogue-db.entrypoints=postgres"
        - "traefik.tcp.routers.rogue-db.service=rogue-db"

        - "traefik.tcp.services.rogue-db.loadbalancer.server.port=5432"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      # Option A: separate fields (no need to URL-encode the password)
      DATA_SOURCE_URI: "postgres-db:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
      # Option B: one full URI
      # DATA_SOURCE_NAME: "postgresql://postgres_exporter:${PG_EXPORTER_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    deploy:
      placement:
        constraints:
          # Make the traefik service run only on the node with this label
          # as the node with it has the volume for the certificates
          - node.labels.rogue_db == true
    networks:
      rogue-public:                     # the network otel scrapes on
      
  # postgres-exporter:
  #   image: bitnamilegacy/postgres-exporter:latest
  #   environment:
  #     DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
  #     # - DATA_SOURCE_USER=bocraportal
  #     # - DATA_SOURCE_PASS=Cash8Aes
  #   ports:
  #     - 9187:9187
  #   deploy:
  #     placement:
  #       constraints:
  #         # Make the traefik service run only on the node with this label
  #         # as the node with it has the volume for the certificates
  #         - node.labels.rogue_db == true
  #   networks:
  #     rogue-public:
###############################################################################
# Networks
###############################################################################
networks:
  rogue-public:
    external: true
